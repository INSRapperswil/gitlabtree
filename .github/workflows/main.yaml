---
name: test gitlabtree
on: [push,pull_request]

jobs:
  linters:
    name: linters
    strategy:
      matrix:
        python-version: [ '3.9' ]
        platform: [ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v2
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64

      - name: Setup uv
        uses: astral-sh/setup-uv@v6.8.0
        with:
          # Glob pattern to match files relative to the repository root to control the cache.
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
          # Suffix for the cache key
          cache-suffix: venv-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}

      - name: Install Dependencies
        run: uv sync
        if: steps.setup-uv.outputs.cache-hit != 'true'

      - name: Run black
        run: make black
      - name: Run mypy
        run: make mypy

  pytest:
    name: Testing on Python ${{ matrix.python-version }} (${{ matrix.platform}})
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.9', '3.10' ]
        platform: [ubuntu-latest, macOS-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v2
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v6.8.0
        with:
          # Glob pattern to match files relative to the repository root to control the cache.
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
          # Suffix for the cache key
          cache-suffix: venv-${{ matrix.python-version }}-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}

      - name: Install Dependencies
        run: uv sync
        if: steps.setup-uv.outputs.cache-hit != 'true'

      - name: Force using UTF-8 encoding for windows tests
        run: uv run python -m pytest -vs
        if: ${{ matrix.platform == 'windows-latest' }}
        env:
          PYTHONIOENCODING: utf-8

      - name: Run pytest
        run: make pytest
        if: ${{ matrix.platform != 'windows-latest' }}

  release:
    name: Releasing to pypi
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags')
    needs: [linters, pytest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: 3.9

      - uses: astral-sh/setup-uv@v6.8.0
        with:
          # Glob pattern to match files relative to the repository root to control the cache.
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
          # Suffix for the cache key
          cache-suffix: venv-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}

      - name: prepare release
        run: make fiximageurls

      - name: build release
        run: uv build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}

      - uses: actions/upload-artifact@v3
        with:
          name: build
          path: dist/*